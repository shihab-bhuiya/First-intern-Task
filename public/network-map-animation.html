<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Network map animation — standalone reference</title>
<style>
  /*
    HOW THIS ANIMATION WORKS — for the developer
    ================================================
    This is NOT a GIF or video file. It's a plain inline SVG, animated using
    SVG's own native animation tags (<animateMotion> and <animate>) — no
    JavaScript, no external library, no image file at all. It's just markup.

    - The moving dots travel along the curved lines using <animateMotion>,
      which follows the same path="..." coordinates as the line itself.
    - The pulsing ring around "Singapore HQ" uses <animate> to loop its
      radius (r) and opacity over 3 seconds.
    - All colors are plain hex values here so this file works standalone.
      On the live site they're CSS variables (var(--signal), var(--teal),
      var(--paper)) so they follow the site's theme automatically.

    To reuse this: copy the <div class="netmap-wrap"> block directly into
    any page, plus the two CSS blocks below (.netmap-wrap and its SVG text
    classes). Adjust the cx/cy/path coordinates to reposition nodes, and
    the dur="..." values to speed up or slow down the travelling dots.
  */

  body{background:#0A0D12;margin:0;padding:60px;font-family:sans-serif;}

  .netmap-wrap{position:relative;height:420px;max-width:700px;}
  .netmap-wrap svg{width:100%;height:100%;overflow:visible;}
  .netmap-node-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:10.5px;
    fill:#F8FAFC;
    font-weight:600;
  }
  .netmap-label{
    font-family:'IBM Plex Mono', monospace;
    font-size:9px;
    fill:#94A3B8;
  }
</style>
</head>
<body>

<div class="netmap-wrap" aria-hidden="true">
  <svg viewBox="0 0 380 340">
    <!-- connecting lines -->
    <path id="line1" d="M 70 220 C 130 150, 160 130, 210 90" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1.4"/>
    <path id="line2" d="M 210 90 C 250 100, 270 150, 300 190" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1.4"/>
    <path id="line3" d="M 210 90 C 180 140, 150 200, 130 260" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1.4"/>
    <path id="line4" d="M 70 220 C 100 250, 120 275, 150 295" fill="none" stroke="rgba(244,241,234,0.16)" stroke-width="1.4"/>

    <!-- travelling pulses: each one rides along the matching line's path -->
    <circle r="3" fill="#3B82F6">
      <animateMotion dur="4.5s" repeatCount="indefinite" path="M 70 220 C 130 150, 160 130, 210 90"/>
    </circle>
    <circle r="3" fill="#60A5FA">
      <animateMotion dur="5.2s" repeatCount="indefinite" path="M 210 90 C 250 100, 270 150, 300 190"/>
    </circle>
    <circle r="3" fill="#60A5FA">
      <animateMotion dur="6s" repeatCount="indefinite" path="M 210 90 C 180 140, 150 200, 130 260"/>
    </circle>
    <circle r="3" fill="#F8FAFC">
      <animateMotion dur="5.6s" repeatCount="indefinite" path="M 70 220 C 100 250, 120 275, 150 295"/>
    </circle>

    <!-- node: Head Office (Singapore) — has the pulsing ring effect -->
    <circle cx="210" cy="90" r="5.5" fill="#3B82F6"/>
    <circle cx="210" cy="90" r="5.5" fill="none" stroke="#3B82F6" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="5.5;16;5.5" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;0;0.6" dur="3s" repeatCount="indefinite"/>
    </circle>
    <text x="222" y="86" class="netmap-node-label">Singapore HQ</text>

    <!-- node: Australia -->
    <circle cx="70" cy="220" r="5" fill="#F8FAFC"/>
    <text x="82" y="216" class="netmap-node-label">Australia</text>
    <text x="82" y="230" class="netmap-label">8 branches</text>

    <!-- node: India offshore -->
    <circle cx="300" cy="190" r="4.5" fill="#60A5FA"/>
    <text x="312" y="186" class="netmap-node-label">India</text>
    <text x="312" y="200" class="netmap-label">offshore team</text>

    <!-- node: Philippines offshore -->
    <circle cx="130" cy="260" r="4.5" fill="#60A5FA"/>
    <text x="142" y="256" class="netmap-node-label">Philippines</text>
    <text x="142" y="270" class="netmap-label">offshore team</text>

    <!-- node: Auckland, NZ -->
    <circle cx="150" cy="300" r="4.5" fill="#F8FAFC"/>
    <text x="162" y="296" class="netmap-node-label">Auckland</text>
    <text x="162" y="310" class="netmap-label">New Zealand</text>
  </svg>
</div>

</body>
</html>
